name: Build and Release Droidspaces RootFS

# Manual only: start it from the Actions tab (Run workflow).
# The push and weekly schedule triggers were removed on purpose.
on:
  workflow_dispatch:
    inputs:
      update_json_only:
        description: 'Only regenerate rootfs.json from the latest release (skip build & release)'
        type: boolean
        default: false
      architectures:
        description: 'Architectures to build (ignored when "Only regenerate rootfs.json" is checked)'
        type: choice
        default: all
        options:
          - all
          - x86_64
          - aarch64
      rootfs_format:
        description: 'Archive format of the built rootfs (ignored when "Only regenerate rootfs.json" is checked)'
        type: choice
        default: tar.xz
        options:
          - tar.xz
          - tar.gz
          - tar.zst

concurrency:
  group: rootfs-release
  cancel-in-progress: false

jobs:
  setup:
    if: ${{ github.event.inputs.update_json_only != 'true' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      build_id: ${{ steps.prep.outputs.build_id }}
      build_date: ${{ steps.prep.outputs.build_date }}
      rootfs_format: ${{ steps.prep.outputs.rootfs_format }}
    steps:
      - uses: actions/checkout@v4

      - name: Lint template labels
        run: python3 scripts/generate_rootfs_json.py --lint

      - name: Build matrix from templates/<arch>/*.Dockerfile
        id: matrix
        env:
          ARCH_SELECTION: ${{ inputs.architectures }}
        run: |
          MATRIX=$(find templates -mindepth 2 -name '*.Dockerfile' -printf '%P\n' | sort \
            | jq -R -s -c --slurpfile archs archs.json --arg sel "${ARCH_SELECTION:-all}" '
                split("\n")[:-1]
                | map(capture("^(?<arch>[^/]+)/(?<name>.+)\\.Dockerfile$"))
                | map(select($sel == "all" or .arch == $sel))
                | map(. + $archs[0][.arch])
                | {include: .}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "$MATRIX" | jq .

      - name: Prepare build metadata
        id: prep
        env:
          ROOTFS_FORMAT: ${{ inputs.rootfs_format }}
        run: |
          echo "rootfs_format=${ROOTFS_FORMAT:-tar.xz}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"
          echo "build_id=v$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    name: ${{ matrix.arch }}/${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure zstd is installed
        if: ${{ needs.setup.outputs.rootfs_format == 'tar.zst' }}
        run: command -v zstd >/dev/null || { sudo apt-get update && sudo apt-get install -y zstd; }

      - name: Build rootfs
        run: bash ./build.sh -a "${{ matrix.arch }}" -i "${{ matrix.name }}" -v "${{ needs.setup.outputs.build_id }}" -f "${{ needs.setup.outputs.rootfs_format }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-${{ matrix.name }}
          path: "*.${{ needs.setup.outputs.rootfs_format }}"
          retention-days: 1
          if-no-files-found: error

  release:
    needs: [setup, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.build_id }}
          name: "Droidspaces RootFS ${{ needs.setup.outputs.build_id }}"
          files: "*.${{ needs.setup.outputs.rootfs_format }}"
          body: |
            Automated Droidspaces RootFS multi-arch build
            Built on: ${{ needs.setup.outputs.build_date }}
            Build ID: ${{ needs.setup.outputs.build_id }}
            Format: ${{ needs.setup.outputs.rootfs_format }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate and push rootfs.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/generate_rootfs_json.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rootfs.json
          git diff --cached --quiet && { echo "rootfs.json unchanged"; exit 0; }
          git commit -m "chore: update rootfs.json for release ${{ needs.setup.outputs.build_id }}"
          git pull --rebase origin main
          git push origin HEAD:main

  update-json:
    if: ${{ github.event.inputs.update_json_only == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate and push rootfs.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/generate_rootfs_json.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rootfs.json
          git diff --cached --quiet && { echo "rootfs.json unchanged"; exit 0; }
          git commit -m "chore: update rootfs.json"
          git pull --rebase origin main
          git push origin HEAD:main
